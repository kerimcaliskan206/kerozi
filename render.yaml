# Plan names: "starter" (web) and "basic-256mb" (Postgres) were valid when written.
# Render renames plans from time to time: verify both in the dashboard before applying.
services:
  - type: web
    name: kerozi
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi:app init-db
    startCommand: gunicorn wsgi:app --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      # Same as local venv. Verify this is a Python version Render supports.
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: kerozi-db
          property: connectionString
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
      - key: IYZICO_BASE_URL
        value: https://sandbox-api.iyzipay.com
      # Set after the public URL is known: https://<service>.onrender.com/api/iyzico/callback
      - key: IYZICO_CALLBACK_URL
        sync: false

databases:
  - name: kerozi-db
    plan: basic-256mb
    ipAllowList: []  # internal connections only (web service in the same region)
