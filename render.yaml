# FREE PLANS: the free web service sleeps after 15 minutes of inactivity; the free Postgres
# expires 30 days after creation and is deleted 14 days later. Upgrade before real sales.
services:
  - type: web
    name: kerozi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi:app init-db && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /health
    envVars:
      # Same as local venv. Verify this is a Python version Render supports.
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: kerozi-db
          property: connectionString
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
      - key: IYZICO_BASE_URL
        value: https://sandbox-api.iyzipay.com
      # Set after the public URL is known: https://<service>.onrender.com/api/iyzico/callback
      - key: IYZICO_CALLBACK_URL
        sync: false

databases:
  - name: kerozi-db
    plan: free
    ipAllowList: []  # internal connections only (web service in the same region)
